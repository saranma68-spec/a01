<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Robot Coder</title>
    <!-- Using Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #050510;
            color: #e0e0e0;
            /* Simple scanline effect */
            background-image: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        .neon-text-cyan {
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
        
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffff00, 0 0 10px #ffff00, 0 0 20px #ffff00;
        }

        .grid-cell {
            transition: all 0.2s ease-in-out;
            box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.2);
        }
        
        .wall {
            background: repeating-linear-gradient(
                45deg,
                #ff0055,
                #ff0055 10px,
                #aa0033 10px,
                #aa0033 20px
            );
            box-shadow: 0 0 10px #ff0055;
        }

        .robot {
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }
        
        .goal {
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 5px #00ff00; background-color: rgba(0, 255, 0, 0.3); }
            to { box-shadow: 0 0 20px #00ff00; background-color: rgba(0, 255, 0, 0.8); }
        }

        /* Direction classes for the robot */
        .dir-0 { transform: rotate(0deg); }   /* Right */
        .dir-1 { transform: rotate(90deg); }  /* Down */
        .dir-2 { transform: rotate(180deg); } /* Left */
        .dir-3 { transform: rotate(270deg); } /* Up */
        
        .btn-arcade {
            transition: transform 0.1s;
        }
        .btn-arcade:active {
            transform: scale(0.95);
        }
        .btn-arcade:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-gray-900 border-4 border-cyan-500 p-6 rounded-lg shadow-[0_0_30px_rgba(0,255,255,0.3)]">
        
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-4xl text-cyan-400 neon-text-cyan mb-2">NEON CYBER BOT</h1>
            <p class="text-xs text-gray-400">STAGE: <span id="level-display">1</span></p>
        </header>

        <div id="message-box" class="text-center text-sm md:text-base font-bold h-8 mb-4 text-gray-400">
            SYSTEM READY. AWAITING INPUT...
        </div>

        <div class="flex flex-col md:flex-row gap-8">
            
            <div class="flex-1 flex justify-center items-center">
                <div id="game-board" class="grid gap-1 bg-gray-800 p-2 border-2 border-purple-500 rounded">
                    <!-- Grid will be generated here -->
                </div>
            </div>

            <div class="flex-1 flex flex-col gap-4">
                <div class="bg-gray-800 border-2 border-green-500 p-4 rounded min-h-[120px]">
                    <h2 class="text-green-400 text-xs mb-2">COMMAND SEQUENCE:</h2>
                    <div id="command-queue" class="flex flex-wrap gap-2 min-h-[40px] items-center">
                        <span id="empty-queue-text" class="text-gray-500 text-xs">NO COMMANDS LOADED</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="addCommand('turn-left')" class="btn-arcade bg-purple-700 hover:bg-purple-600 text-white p-3 rounded border-b-4 border-purple-900 text-sm">
                        ↺ LFT
                    </button>
                    <button onclick="addCommand('forward')" class="btn-arcade bg-cyan-600 hover:bg-cyan-500 text-white p-3 rounded border-b-4 border-cyan-800 text-sm">
                        ↑ FWD
                    </button>
                    <button onclick="addCommand('turn-right')" class="btn-arcade bg-purple-700 hover:bg-purple-600 text-white p-3 rounded border-b-4 border-purple-900 text-sm">
                        ↻ RGT
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button onclick="clearCommands()" id="clear-btn" class="btn-arcade bg-red-600 hover:bg-red-500 text-white p-3 rounded border-b-4 border-red-800 text-sm">
                        CLEAR
                    </button>
                    <button onclick="runAlgorithm()" id="run-btn" class="btn-arcade bg-green-600 hover:bg-green-500 text-white p-3 rounded border-b-4 border-green-800 text-sm">
                        ▶ EXECUTE
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple synth sounds using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = {
            playTone: (freq, type, duration) => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            click: () => sounds.playTone(800, 'square', 0.1),
            move: () => sounds.playTone(400, 'triangle', 0.2),
            turn: () => sounds.playTone(600, 'sine', 0.15),
            win: () => {
                sounds.playTone(400, 'square', 0.1);
                setTimeout(() => sounds.playTone(600, 'square', 0.1), 100);
                setTimeout(() => sounds.playTone(800, 'square', 0.3), 200);
            },
            lose: () => {
                sounds.playTone(300, 'sawtooth', 0.2);
                setTimeout(() => sounds.playTone(200, 'sawtooth', 0.4), 200);
            }
        };

        const gridSize = 5;
        const levels = [
            {
                // Level 1: Simple straight line
                start: { x: 0, y: 2, dir: 0 }, // 0: Right, 1: Down, 2: Left, 3: Up
                goal: { x: 4, y: 2 },
                walls: []
            },
            {
                // Level 2: One turn
                start: { x: 1, y: 1, dir: 0 },
                goal: { x: 3, y: 3 },
                walls: [{x: 2, y: 1}, {x: 2, y: 2}, {x: 3, y: 1}, {x: 3, y: 2}]
            },
            {
                // Level 3: Navigate around obstacle
                start: { x: 0, y: 0, dir: 1 },
                goal: { x: 4, y: 4 },
                walls: [{x: 0, y: 2}, {x: 1, y: 2}, {x: 2, y: 2}, {x: 3, y: 2}, {x: 2, y: 4}, {x: 3, y: 4}]
            }
        ];

        let currentLevelIndex = 0;
        let robot = { x: 0, y: 0, dir: 0 };
        let commands = [];
        let isRunning = false;

        function initLevel() {
            const level = levels[currentLevelIndex];
            robot = { ...level.start };
            commands = [];
            isRunning = false;
            document.getElementById('level-display').innerText = currentLevelIndex + 1;
            document.getElementById('run-btn').disabled = false;
            updateCommandUI();
            renderBoard();
            showMessage("SYSTEM READY. AWAITING INPUT...", "text-gray-400");
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gridSize}, minmax(0, 1fr))`;
            
            const level = levels[currentLevelIndex];

            // Setup CSS variables for cell size based on screen size
            const cellSize = window.innerWidth < 600 ? '40px' : '60px';

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = `grid-cell bg-gray-900 border border-gray-700 flex items-center justify-center`;
                    cell.style.width = cellSize;
                    cell.style.height = cellSize;

                    // Check for wall
                    const isWall = level.walls.some(w => w.x === x && w.y === y);
                    if (isWall) {
                        cell.classList.add('wall');
                    }

                    // Check for goal
                    if (x === level.goal.x && y === level.goal.y) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="text-green-500 text-xl md:text-2xl">◎</span>';
                    }

                    // Check for robot
                    if (x === robot.x && y === robot.y) {
                        const botVisual = document.createElement('div');
                        botVisual.className = `robot dir-${robot.dir} text-cyan-400 text-xl md:text-3xl neon-text-cyan`;
                        botVisual.innerText = '🤖'; // Or use an arrow icon ➔
                        
                        // Override with a simpler arrow for clearer direction if preferred
                        botVisual.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 md:w-10 md:h-10 text-cyan-400 drop-shadow-[0_0_5px_rgba(0,255,255,1)]"><path d="M12 2L22 20H2L12 2Z"/></svg>`;
                        
                        cell.appendChild(botVisual);
                    }

                    board.appendChild(cell);
                }
            }
        }

        function addCommand(cmd) {
            if (isRunning) return;
            if (commands.length >= 20) {
                showMessage("MEMORY FULL!", "text-red-500");
                return;
            }
            sounds.click();
            commands.push(cmd);
            updateCommandUI();
        }

        function clearCommands() {
            if (isRunning) return;
            sounds.click();
            commands = [];
            updateCommandUI();
        }

        function updateCommandUI() {
            const queue = document.getElementById('command-queue');
            const emptyText = document.getElementById('empty-queue-text');
            queue.innerHTML = '';
            
            if (commands.length === 0) {
                emptyText.style.display = 'block';
                queue.appendChild(emptyText);
            } else {
                emptyText.style.display = 'none';
                commands.forEach((cmd, index) => {
                    const cmdEl = document.createElement('span');
                    let icon = '';
                    let styles = '';
                    
                    if (cmd === 'forward') { icon = '↑'; styles = 'bg-cyan-600 text-white border-cyan-400'; }
                    if (cmd === 'turn-left') { icon = '↺'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    if (cmd === 'turn-right') { icon = '↻'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    
                    // Fixed template literal syntax from the original snippet
                    cmdEl.className = `px-2 py-1 rounded border-2 font-bold text-xs md:text-sm ${styles} shadow-md`;
                    cmdEl.innerText = icon;
                    queue.appendChild(cmdEl);
                });
            }
        }

        function showMessage(msg, colorClass) {
            const msgBox = document.getElementById('message-box');
            // Fixed template literal syntax from the original snippet
            msgBox.className = `text-center text-xs md:text-sm font-bold h-8 mb-4 ${colorClass}`;
            msgBox.innerText = msg;
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function resetLevelWithDelay(message) {
            sounds.lose();
            showMessage(message, "text-red-500");
            await delay(1500); 
            initLevel();       
        }

        async function runAlgorithm() {
            if (isRunning || commands.length === 0) return;
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            showMessage(">> EXECUTING SEQUENCE...", "text-cyan-400 neon-text-cyan");

            const level = levels[currentLevelIndex];
            
            robot = { ...level.start };
            renderBoard();
            await delay(500);

            for (let i = 0; i < commands.length; i++) {
                const cmd = commands[i];
                
                // Highlight current command
                const queueEls = document.getElementById('command-queue').children;
                if(queueEls[i]) {
                    for(let j=0; j<queueEls.length; j++) queueEls[j].style.opacity = '0.5';
                    queueEls[i].style.opacity = '1';
                    queueEls[i].style.transform = 'scale(1.1)';
                }

                if (cmd === 'forward') {
                    let nextX = robot.x;
                    let nextY = robot.y;
                    
                    if (robot.dir === 0) nextX++; // Right
                    if (robot.dir === 1) nextY++; // Down
                    if (robot.dir === 2) nextX--; // Left
                    if (robot.dir === 3) nextY--; // Up

                    // Check bounds
                    if (nextX < 0 || nextX >= gridSize || nextY < 0 || nextY >= gridSize) {
                        renderBoard();
                        await resetLevelWithDelay("CRITICAL ERROR: OUT OF BOUNDS!");
                        return;
                    }

                    // Check walls
                    const isWall = level.walls.some(w => w.x === nextX && w.y === nextY);
                    if (isWall) {
                        renderBoard();
                        await resetLevelWithDelay("COLLISION DETECTED!");
                        return;
                    }

                    robot.x = nextX;
                    robot.y = nextY;
                    sounds.move();

                } else if (cmd === 'turn-left') {
                    robot.dir = (robot.dir + 3) % 4; 
                    sounds.turn();
                } else if (cmd === 'turn-right') {
                    robot.dir = (robot.dir + 1) % 4; 
                    sounds.turn();
                }

                renderBoard();
                await delay(400); // Slightly faster pacing
            }

            // Reset command highlighting
            const queueEls = document.getElementById('command-queue').children;
            for(let j=0; j<queueEls.length; j++) {
                queueEls[j].style.opacity = '1';
                queueEls[j].style.transform = 'scale(1)';
            }

            if (robot.x === level.goal.x && robot.y === level.goal.y) {
                sounds.win();
                showMessage("STAGE CLEARED! ", "text-green-400");
                await delay(2000);
                
                // Fixed syntax error from original snippet here
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    initLevel();
                } else {
                    showMessage("ALL STAGES COMPLETE! YOU WIN!", "text-yellow-300 neon-text-yellow");
                    currentLevelIndex = 0; // Optional: Reset for replay
                    isRunning = false;
                    document.getElementById('run-btn').disabled = false;
                }
            } else {
                await resetLevelWithDelay("MISSION FAILED: TARGET NOT REACHED");
            }
        }

        // Initialize first level on load
        window.onload = initLevel;
    </script>
</body>
</html>
